# Self-hosted GitHub Actions runner for this repo, on github.mieweb.com.
#
# First start (registration tokens expire after an hour):
#   cd runner
#   echo "RUNNER_TOKEN=$(GH_HOST=github.mieweb.com gh api -X POST \
#     repos/rgingras/ozwell-reading-comfort/actions/runners/registration-token -q .token)" > .env
#   docker compose up -d
#
# The registration is kept in the runner-config volume, so later restarts
# (including after a reboot) reuse it and the token isn't needed again.
# To remove the runner: docker compose down -v, then delete it under
# the repo's Settings > Actions > Runners.
services:
  runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: https://github.mieweb.com/rgingras/ozwell-reading-comfort
      RUNNER_NAME: better-ozwell-${HOSTNAME:-laptop}
      LABELS: linux,x64,better-ozwell
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_WORKDIR: /tmp/runner/work
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
    volumes:
      - runner-config:/runner/data
volumes:
  runner-config:
