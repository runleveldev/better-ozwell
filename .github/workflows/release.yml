# Sign Better Ozwell as an unlisted (self-distributed) add-on on
# addons.mozilla.org and attach the signed .xpi to a GitHub release.
#
# Trigger: push a tag matching the manifest version, e.g.
#   git tag v1.0.1 && git push origin v1.0.1
# or run it by hand from the Actions tab.
#
# Needs two repository secrets, from https://addons.mozilla.org/developers/addon/api/key/
#   AMO_JWT_ISSUER  ("JWT issuer", like user:12345:67)
#   AMO_JWT_SECRET  ("JWT secret")
#
# AMO refuses a version it has already signed, so bump "version" in
# manifest.json (and package.json) before each release.

name: Sign and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload the .xpi

jobs:
  sign:
    # Self-hosted runner from runner/compose.yml (github.mieweb.com has no
    # GitHub-hosted runners)
    runs-on: [self-hosted, better-ozwell]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@8 lint --ignore-files icons/icon.svg --self-hosted

      - name: Sign on addons.mozilla.org (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets (https://addons.mozilla.org/developers/addon/api/key/)"
            exit 1
          fi
          npx --yes web-ext@8 sign \
            --channel unlisted \
            --ignore-files icons/icon.svg README.md package.json .github \
            --artifacts-dir web-ext-artifacts \
            --approval-timeout 900000

      - name: Attach to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.mieweb.com   # gh defaults to github.com
        run: |
          # (upload-artifact@v4 isn't supported on GitHub Enterprise Server, so the
          # release is the only place the signed .xpi is kept)
          cp web-ext-artifacts/*.xpi "better-ozwell-${GITHUB_REF_NAME#v}.xpi"
          gh release create "$GITHUB_REF_NAME" "better-ozwell-${GITHUB_REF_NAME#v}.xpi" \
            --title "Better Ozwell $GITHUB_REF_NAME" \
            --notes "Signed by addons.mozilla.org (unlisted). Install by opening the .xpi in Firefox."
