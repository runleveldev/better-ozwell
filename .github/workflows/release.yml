# Sign Better Ozwell as an unlisted (self-distributed) add-on on
# addons.mozilla.org, attach the signed .xpi to a GitHub release, and add it to
# updates.json so installed copies update themselves.
#
# Trigger: push a tag matching the manifest version, e.g.
#   git tag v1.0.2 && git push origin v1.0.2
#
# Needs two repository secrets, from https://addons.mozilla.org/developers/addon/api/key/
#   AMO_JWT_ISSUER  ("JWT issuer", like user:12345:67)
#   AMO_JWT_SECRET  ("JWT secret")
#
# AMO refuses a version it has already signed, so bump "version" in
# manifest.json (and package.json) before each release.

name: Sign and release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and commit updates.json

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches manifest.json
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
          echo "VERSION=$manifest_version" >> "$GITHUB_ENV"

      - name: Lint
        run: npx --yes web-ext@8 lint --ignore-files icons/icon.svg updates.json scripts --self-hosted

      - name: Sign on addons.mozilla.org (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets (https://addons.mozilla.org/developers/addon/api/key/)"
            exit 1
          fi
          npx --yes web-ext@8 sign \
            --channel unlisted \
            --ignore-files icons/icon.svg README.md package.json updates.json scripts .github \
            --artifacts-dir web-ext-artifacts \
            --approval-timeout 900000
          cp web-ext-artifacts/*.xpi "better-ozwell-$VERSION.xpi"

      # Keep a copy on the run even if a later step fails (AMO won't re-sign)
      - uses: actions/upload-artifact@v4
        with:
          name: better-ozwell-${{ env.VERSION }}
          path: better-ozwell-${{ env.VERSION }}.xpi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "better-ozwell-$VERSION.xpi" \
            --title "Better Ozwell $GITHUB_REF_NAME" \
            --notes "Signed by addons.mozilla.org (unlisted). Install by opening the .xpi in Firefox; it then updates itself."

      - name: Add the release to updates.json
        run: |
          hash=$(sha256sum "better-ozwell-$VERSION.xpi" | cut -d' ' -f1)
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          node scripts/add-update.mjs "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/better-ozwell-$VERSION.xpi" \
            "sha256:$hash"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "updates.json: $GITHUB_REF_NAME"
          git push origin main
